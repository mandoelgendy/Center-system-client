<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eman Manager - النسخة النهائية</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>body{font-family:'Cairo',sans-serif;background:#0a0a0a;color:#fff}.mono{font-family:'JetBrains Mono',monospace}</style>
</head>
<body class="p-3 md:p-6">
<div class="max-w-6xl mx-auto">
<div class="flex flex-wrap gap-2 items-center justify-between mb-4 bg-zinc-900 border border-zinc-800 rounded-2xl p-3">
<h1 class="text-xl font-bold">📚 نظام إدارة إيمان - النسخة الكاملة</h1>
<div class="flex gap-2">
<button onclick="openModal('student')" class="bg-amber-500 text-black px-4 h-10 rounded-xl font-bold text-sm">+ طالب</button>
<button onclick="openModal('group')" class="bg-zinc-800 border border-zinc-700 px-4 h-10 rounded-xl font-bold text-sm">+ مجموعة</button>
<button onclick="openModal('settings')" class="bg-zinc-800 border border-zinc-700 px-3 h-10 rounded-xl text-sm">⚙️</button>
<button onclick="exportData()" class="bg-zinc-800 border border-zinc-700 px-3 h-10 rounded-xl text-sm">📤</button>
</div>
</div>

<div class="mb-4 bg-black border border-amber-400/30 rounded-2xl p-3 flex gap-2 items-center">
<span class="text-amber-400 text-xs font-bold">📷 السكانر العام:</span>
<input id="globalScanner" placeholder="اضرب باركود الطالب هنا (Enter)" class="flex-1 h-10 bg-zinc-900 border border-zinc-800 rounded-xl px-3 text-sm mono outline-none">
</div>

<div class="flex gap-2 mb-4">
<button onclick="switchTab('roster')" id="tab-roster" class="tab-btn bg-amber-500 text-black px-5 h-10 rounded-xl font-bold text-sm">الكشوف</button>
<button onclick="switchTab('students')" id="tab-students" class="tab-btn bg-zinc-800 border border-zinc-700 px-5 h-10 rounded-xl font-bold text-sm">الطلاب</button>
<button onclick="switchTab('groups')" id="tab-groups" class="tab-btn bg-zinc-800 border border-zinc-700 px-5 h-10 rounded-xl font-bold text-sm">المجموعات</button>
<button onclick="switchTab('week')" id="tab-week" class="tab-btn bg-zinc-800 border border-zinc-700 px-5 h-10 rounded-xl font-bold text-sm">الأسبوع</button>
</div>

<div id="view-roster"></div>
<div id="view-students" class="hidden"></div>
<div id="view-groups" class="hidden"></div>
<div id="view-week" class="hidden"></div>
</div>

<div id="modal-student" class="fixed inset-0 z-[101] hidden bg-black/80 flex items-center justify-center p-4"><div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 w-full max-w-sm"><h3 class="font-bold mb-3">إضافة / تعديل طالب</h3><input id="s-name" placeholder="اسم الطالب" class="w-full h-11 bg-black border border-zinc-800 rounded-xl px-3 mb-2 outline-none"><input id="s-code" placeholder="كود / باركود الطالب" class="w-full h-11 bg-black border border-zinc-800 rounded-xl px-3 mb-2 outline-none mono"><select id="s-group" class="w-full h-11 bg-black border border-zinc-800 rounded-xl px-3 mb-3 outline-none"></select><div class="flex gap-2"><button onclick="saveStudent()" class="flex-1 bg-amber-500 text-black h-11 rounded-xl font-bold">حفظ</button><button onclick="closeModal()" class="flex-1 bg-zinc-800 h-11 rounded-xl">إلغاء</button></div></div></div>
<div id="modal-group" class="fixed inset-0 z-[101] hidden bg-black/80 flex items-center justify-center p-4"><div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 w-full max-w-sm"><h3 class="font-bold mb-3">إضافة مجموعة</h3><input id="g-name" placeholder="اسم المجموعة" class="w-full h-11 bg-black border border-zinc-800 rounded-xl px-3 mb-2 outline-none"><input id="g-teacher" placeholder="اسم المدرس" class="w-full h-11 bg-black border border-zinc-800 rounded-xl px-3 mb-3 outline-none"><div class="flex gap-2"><button onclick="saveGroup()" class="flex-1 bg-amber-500 text-black h-11 rounded-xl font-bold">حفظ</button><button onclick="closeModal()" class="flex-1 bg-zinc-800 h-11 rounded-xl">إلغاء</button></div></div></div>
<div id="modal-settings" class="fixed inset-0 z-[101] hidden bg-black/80 flex items-center justify-center p-4"><div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 w-full max-w-sm"><h3 class="font-bold mb-3">الإعدادات</h3><label class="text-xs text-zinc-400">نسبة الغياب المسموحة %</label><input id="set-perc" type="number" class="w-full h-11 bg-black border border-zinc-800 rounded-xl px-3 mb-3 outline-none"><div class="flex gap-2"><button onclick="saveSettings()" class="flex-1 bg-amber-500 text-black h-11 rounded-xl font-bold">حفظ</button><button onclick="closeModal()" class="flex-1 bg-zinc-800 h-11 rounded-xl">إلغاء</button></div></div></div>

<script>
let DB = JSON.parse(localStorage.getItem('eman_v2_final') || '{"students":[],"groups":[],"booking":[],"settings":{"perc":15}}');
const save=()=>{localStorage.setItem('eman_v2_final',JSON.stringify(DB))};
const genId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function switchTab(t){document.querySelectorAll('[id^=view-]').forEach(e=>e.classList.add('hidden'));document.getElementById('view-'+t).classList.remove('hidden');document.querySelectorAll('.tab-btn').forEach(b=>{b.className='tab-btn bg-zinc-800 border border-zinc-700 px-5 h-10 rounded-xl font-bold text-sm'});document.getElementById('tab-'+t).className='tab-btn bg-amber-500 text-black px-5 h-10 rounded-xl font-bold text-sm'; if(t=='roster') renderRoster(); if(t=='students') renderStudents(); if(t=='groups') renderGroups(); if(t=='week') renderWeek();}
function openModal(n){document.getElementById('modal-'+n).classList.remove('hidden'); if(n=='student'){let sel=document.getElementById('s-group'); sel.innerHTML='<option value="">بدون مجموعة</option>'+DB.groups.map(g=>`<option value="${g.id}">${g.name} - ${g.teacher}</option>`).join('');}}
function closeModal(){document.querySelectorAll('[id^=modal-]').forEach(m=>m.classList.add('hidden'));}
function saveSettings(){DB.settings.perc=parseInt(document.getElementById('set-perc').value)||15; save(); closeModal();}
function saveGroup(){let name=document.getElementById('g-name').value.trim(); let teacher=document.getElementById('g-teacher').value.trim(); if(!name) return alert('اكتب اسم المجموعة'); DB.groups.push({id:genId(),name,teacher,history:[]}); save(); closeModal(); renderAll();}
function saveStudent(){let name=document.getElementById('s-name').value.trim(); let code=document.getElementById('s-code').value.trim(); let groupId=document.getElementById('s-group').value; if(!name||!code) return alert('اكمل البيانات'); let exists=DB.students.find(s=>s.code==code); if(exists){exists.name=name; exists.groupId=groupId;} else {DB.students.push({id:genId(),name,code,groupId,absent:0});} save(); closeModal(); renderAll();}
function deleteStudent(id){if(!confirm('حذف الطالب؟'))return; DB.students=DB.students.filter(s=>s.id!=id); save(); renderAll();}
function deleteGroup(id){if(!confirm('حذف المجموعة وكل طلابها؟'))return; DB.groups=DB.groups.filter(g=>g.id!=id); DB.students=DB.students.filter(s=>s.groupId!=id); save(); renderAll();}
function handleGroupScanner(code, groupId){code=String(code).trim(); if(!code) return; let s=DB.students.find(x=>String(x.code).trim()==code); if(!s){ alert('❌ الكود غير موجود: '+code); return; } s.groupId=groupId; save(); renderRoster();}
function handleScanner(code){code=String(code).trim(); if(!code) return; let s=DB.students.find(x=>String(x.code).trim()==code); if(!s){alert('الكود مش موجود: '+code); return;} let g=DB.groups.find(gr=>gr.id==s.groupId); if(g){markAbsence(s.code,g.id);} document.getElementById('globalScanner').value='';}
function markAbsence(idNum,groupId){let s=DB.students.find(x=>String(x.code)==String(idNum)); if(!s) return; let g=DB.groups.find(x=>x.id==groupId); if(!g) return; let today=new Date().toISOString().slice(0,10); if(!g.history) g.history=[]; if(g.history.find(h=>h.date==today && h.studentId==s.id)) return alert('تم تسجيله اليوم بالفعل'); g.history.push({date:today,studentId:s.id,present:true}); save(); renderRoster();}
function calcGroup(g){let total=DB.students.filter(s=>s.groupId==g.id).length; let today=new Date().toISOString().slice(0,10); let present=(g.history||[]).filter(h=>h.date==today).length; return {total,present};}
function renderRoster(){let filter=document.getElementById('rosterFilter')?.value||''; let html=''; DB.groups.forEach(g=>{if(filter && g.id!=filter) return; let {total,present}=calcGroup(g); let students=DB.students.filter(s=>s.groupId==g.id); html+=`<div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 mb-4"><div class="flex justify-between items-center mb-3"><div><h3 class="font-bold text-lg">${g.name}</h3><p class="text-xs text-zinc-400">${g.teacher} - ${total} طالب - حضر اليوم ${present}</p></div><div class="flex gap-2"><button onclick="toggleBooking('${g.id}')" class="bg-zinc-800 border border-zinc-700 px-3 h-9 rounded-xl text-xs">${DB.booking.includes(g.id)?'✅ محجوز':'📅 حجز'}</button><button onclick="deleteGroup('${g.id}')" class="bg-red-900/30 text-red-400 px-3 h-9 rounded-xl text-xs">حذف</button></div></div><div class="mt-3 grid grid-cols-4 gap-2">${students.map(s=>`<div class="bg-black border border-zinc-800 rounded-xl p-2 text-center"><div class="text-[11px] font-bold truncate">${s.name}</div><div class="text-[10px] mono text-zinc-500">${s.code}</div><button onclick="markAbsence('${s.code}','${g.id}')" class="mt-1 w-full h-6 bg-amber-500/20 text-amber-400 rounded-lg text-[10px]">حضور</button></div>`).join('') || '<div class="col-span-4 text-center text-xs text-zinc-500 py-4">لا يوجد طلاب - استخدم السكانر بالأسفل لإضافتهم</div>'} </div><div class="mt-3 flex gap-2"><input onkeydown="if(event.key==='Enter'){handleGroupScanner(this.value,'${g.id}'); this.value='';}" placeholder="📷 سكان لإضافة طالب للحجز - ${g.teacher}" class="flex-1 h-10 bg-black border border-amber-400/40 rounded-xl px-3 text-xs font-mono text-amber-400 outline-none placeholder:text-amber-400/50"></div></div><div class="flex gap-2"></div></div>`;}); document.getElementById('view-roster').innerHTML=`<div class="mb-3 flex gap-2"><select id="rosterFilter" onchange="renderRoster()" class="h-10 bg-zinc-900 border border-zinc-800 rounded-xl px-3 text-sm"><option value="">كل المجموعات</option>${DB.groups.map(g=>`<option value="${g.id}" ${filter==g.id?'selected':''}>${g.name}</option>`).join('')}</select></div>`+html;}
function renderWeek(){let days=[['السبت',0],['الأحد',1],['الإثنين',2],['الثلاثاء',3],['الأربعاء',4],['الخميس',5],['الجمعة',6]]; document.getElementById('view-week').innerHTML='<div class="grid grid-cols-1 md:grid-cols-2 gap-3">'+days.map(d=>`<div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4"><h4 class="font-bold mb-2">${d[0]}</h4><div class="text-xs text-zinc-500">${DB.groups.map(g=>g.name).join(' - ')||'لا مجموعات'}</div></div>`).join('')+'</div>';}
function toggleBooking(id){if(DB.booking.includes(id)) DB.booking=DB.booking.filter(x=>x!=id); else DB.booking.push(id); save(); renderRoster();}
function renderStudents(){let q=(document.getElementById('studentSearch')?.value||'').toLowerCase(); document.getElementById('view-students').innerHTML=`<div class="mb-3"><input id="studentSearch" oninput="renderStudents()" placeholder="بحث عن طالب..." class="w-full h-11 bg-zinc-900 border border-zinc-800 rounded-xl px-3 outline-none"></div><div class="grid grid-cols-2 md:grid-cols-4 gap-2">${DB.students.filter(s=>s.name.toLowerCase().includes(q)||s.code.includes(q)).map(s=>{let g=DB.groups.find(gr=>gr.id==s.groupId); return `<div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-3"><div class="font-bold text-sm truncate">${s.name}</div><div class="mono text-xs text-zinc-400">${s.code}</div><div class="text-[11px] text-amber-400 mt-1">${g?g.name:'بدون مجموعة'}</div><button onclick="deleteStudent('${s.id}')" class="mt-2 w-full h-7 bg-red-900/20 text-red-400 rounded-lg text-xs">حذف</button></div>`}).join('')}</div>`;}
function renderGroups(){document.getElementById('view-groups').innerHTML=`<div class="grid grid-cols-1 md:grid-cols-3 gap-3">${DB.groups.map(g=>{let c=DB.students.filter(s=>s.groupId==g.id).length; return `<div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4"><h3 class="font-bold">${g.name}</h3><p class="text-xs text-zinc-400">${g.teacher} - ${c} طالب</p><button onclick="deleteGroup('${g.id}')" class="mt-3 w-full h-9 bg-red-900/20 text-red-400 rounded-xl text-xs">حذف المجموعة</button></div>`}).join('')}</div>`;}
function renderAll(){renderRoster();renderStudents();renderGroups();renderWeek();}
function exportData(){let b=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'}); let a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='eman_backup.json'; a.click();}
document.getElementById('globalScanner')?.addEventListener('keydown',e=>{if(e.key==='Enter'){handleScanner(e.target.value); e.target.value='';}});
renderAll();switchTab('roster');
</script>
</body>
  </html>
