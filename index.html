<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>MANDO CENTER OS - سنتر الإيمان</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>body{font-family:'Cairo',sans-serif;background:#070708;color:#fff}.mono{font-family:'JetBrains Mono',monospace}</style>
</head>
<body class="min-h-screen">
<div class="sticky top-0 z-50 bg-black/90 backdrop-blur border-b border-zinc-800">
<div class="max-w-[1400px] mx-auto px-3 py-2 flex items-center justify-between">
<div class="flex items-center gap-3"><div class="w-9 h-9 bg-amber-500 rounded-xl flex items-center justify-center text-black font-black">M</div><div><div class="font-extrabold leading-none">MANDO CENTER OS</div><div id="centerNameLabel" class="text-[10px] text-amber-400">سنتر الإيمان - Premium</div></div></div>
<div class="flex gap-1.5"><button onclick="openSet()" class="h-9 px-3 bg-zinc-900 border border-zinc-800 rounded-xl text-xs">⚙️ الإعدادات</button><button onclick="exportDB()" class="h-9 px-3 bg-zinc-900 border border-zinc-800 rounded-xl text-xs">📤 نسخ</button></div>
</div>
</div>

<div class="max-w-[1400px] mx-auto p-3 grid grid-cols-12 gap-3">
<div class="col-span-12 lg:col-span-3 space-y-3">
<div class="bg-zinc-900 border border-zinc-800 rounded-[20px] p-4">
<div class="flex justify-between items-center mb-3"><h3 class="font-bold text-sm">📊 اليوم</h3><span id="todayDate" class="text-[11px] text-zinc-500"></span></div>
<div class="grid grid-cols-2 gap-2">
<div class="bg-black rounded-2xl p-3 border border-zinc-800"><div class="text-[10px] text-zinc-500">إجمالي دخل</div><div id="statIncome" class="font-bold text-amber-400 text-lg">0 جنيه</div></div>
<div class="bg-black rounded-2xl p-3 border border-zinc-800"><div class="text-[10px] text-zinc-500">حضور اليوم</div><div id="statAttend" class="font-bold text-white text-lg">0</div></div>
<div class="bg-black rounded-2xl p-3 border border-zinc-800"><div class="text-[10px] text-zinc-500">فلوس السنتر</div><div id="statCenter" class="font-bold text-emerald-400 text-lg">0</div></div>
<div class="bg-black rounded-2xl p-3 border border-zinc-800"><div class="text-[10px] text-zinc-500">فلوس المدرسين</div><div id="statTeacher" class="font-bold text-zinc-300 text-lg">0</div></div>
</div>
</div>
<div class="bg-zinc-900 border border-amber-500/20 rounded-[20px] p-3">
<div class="flex gap-2 mb-2"><input id="globalScan" placeholder="📷 سكان عام (كود الطالب + Enter)" class="flex-1 h-11 bg-black border border-amber-500/30 rounded-xl px-3 text-sm mono outline-none"><button onclick="doGlobalScan()" class="h-11 px-4 bg-amber-500 text-black rounded-xl font-bold text-xs">تسجيل</button></div>
<p class="text-[10px] text-zinc-500">السكانر العام يحضر الطالب في مجموعته أوتوماتيك</p>
</div>
<div class="bg-zinc-900 border border-amber-500/20 rounded-[20px] p-3">
<h3 class="font-bold text-xs mb-2">➕ إضافة سريعة</h3>
<div class="grid grid-cols-2 gap-2">
<button onclick="openModal('student')" class="h-10 bg-amber-500 text-black rounded-xl font-bold text-xs">+ طالب جديد</button>
<button onclick="openModal('group')" class="h-10 bg-zinc-800 border border-zinc-700 rounded-xl font-bold text-xs">+ مجموعة / حصة</button>
<button onclick="openModal('hall')" class="h-10 bg-zinc-800 border border-zinc-700 rounded-xl font-bold text-xs">+ قاعة</button>
<button onclick="switchView('kashkool')" class="h-10 bg-black border border-emerald-500/30 text-emerald-400 rounded-xl font-bold text-xs">📒 الكشكول</button>
</div>
</div>
<div class="bg-black border border-zinc-800 rounded-[20px] p-3"><h3 class="font-bold text-xs mb-2">قاعات السنتر</h3><div id="hallsList" class="space-y-1.5"></div></div>
</div>

<div class="col-span-12 lg:col-span-9">
<div class="flex gap-2 mb-3 overflow-x-auto">
<button data-v="roster" onclick="switchView('roster')" class="vbtn h-10 px-5 bg-amber-500 text-black rounded-xl font-bold text-xs">🗂️ الكشوف</button>
<button data-v="students" onclick="switchView('students')" class="vbtn h-10 px-5 bg-zinc-900 border border-zinc-800 rounded-xl font-bold text-xs">👨‍🎓 الطلاب</button>
<button data-v="kashkool" onclick="switchView('kashkool')" class="vbtn h-10 px-5 bg-zinc-900 border border-zinc-800 rounded-xl font-bold text-xs">📒 كشف الحساب</button>
<button data-v="debts" onclick="switchView('debts')" class="vbtn h-10 px-5 bg-zinc-900 border border-zinc-800 rounded-xl font-bold text-xs">💳 مديونيات</button>
</div>
<div id="view-roster"></div>
<div id="view-students" class="hidden"></div>
<div id="view-kashkool" class="hidden"></div>
<div id="view-debts" class="hidden"></div>
</div>
</div>

<div id="m-student" class="fixed inset-0 z-[100] hidden bg-black/80 backdrop-blur flex items-center justify-center p-3"><div class="bg-zinc-900 border border-zinc-800 rounded-[24px] w-full max-w-lg p-5 max-h-[90vh] overflow-y-auto">
<h2 class="font-extrabold text-lg mb-1">طالب جديد</h2><p class="text-[11px] text-zinc-500 mb-4">الكود اوتوماتيك MC-2026-xxxx + باركود</p>
<div class="grid grid-cols-2 gap-2">
<input id="st-name" placeholder="اسم الطالب *" class="col-span-2 h-11 bg-black border border-zinc-800 rounded-xl px-3 text-sm outline-none">
<input id="st-phone" placeholder="رقم الطالب" class="h-11 bg-black border border-zinc-800 rounded-xl px-3 text-sm outline-none mono">
<input id="st-parent" placeholder="رقم ولي الأمر * واتساب" class="h-11 bg-black border border-zinc-800 rounded-xl px-3 text-sm outline-none mono">
<input id="st-school" placeholder="المدرسة" class="h-11 bg-black border border-zinc-800 rounded-xl px-3 text-sm outline-none">
<input id="st-grade" placeholder="الصف (3 ثانوي)" class="h-11 bg-black border border-zinc-800 rounded-xl px-3 text-sm outline-none">
<input id="st-area" placeholder="المنطقة" class="col-span-2 h-11 bg-black border border-zinc-800 rounded-xl px-3 text-sm outline-none">
<select id="st-group" class="col-span-2 h-11 bg-black border border-zinc-800 rounded-xl px-3 text-sm outline-none"></select>
<select id="st-status" class="h-11 bg-black border border-zinc-800 rounded-xl px-3 text-sm outline-none"><option value="active">✅ نشط</option><option value="blocked">🚫 محظور</option><option value="late">⚠️ متأخر</option><option value="debtor">💳 مديون</option></select>
<input id="st-code" placeholder="كود مخصص (اختياري)" class="h-11 bg-black border border-amber-500/30 rounded-xl px-3 text-sm mono outline-none">
</div>
<textarea id="st-note" placeholder="ملاحظات سرية" class="w-full mt-2 h-20 bg-black border border-zinc-800 rounded-xl p-3 text-sm outline-none"></textarea>
<div class="flex gap-2 mt-4"><button onclick="saveStudent()" class="flex-1 h-12 bg-amber-500 text-black rounded-xl font-black">حفظ الطالب</button><button onclick="closeM()" class="flex-1 h-12 bg-zinc-800 rounded-xl font-bold">إلغاء</button></div>
</div></div>

<div id="m-group" class="fixed inset-0 z-[100] hidden bg-black/80 flex items-center justify-center p-3"><div class="bg-zinc-900 border border-zinc-800 rounded-[24px] w-full max-w-lg p-5">
<h2 class="font-extrabold text-lg mb-4">مجموعة / حصة</h2>
<div class="grid grid-cols-2 gap-2">
<input id="g-subject" list="subjectsList" placeholder="المادة" class="col-span-2 h-11 bg-black border border-zinc-800 rounded-xl px-3 text-sm outline-none"><datalist id="subjectsList"><option value="عربي"><option value="انجليزي"><option value="رياضة"><option value="كيمياء"><option value="فيزياء"><option value="احياء"><option value="فرنساوي"></datalist>
<input id="g-teacher" placeholder="اسم المدرس *" class="col-span-2 h-11 bg-black border border-zinc-800 rounded-xl px-3 text-sm outline-none">
<select id="g-day" class="h-11 bg-black border border-zinc-800 rounded-xl px-3 text-sm outline-none"><option>السبت</option><option>الأحد</option><option>الإثنين</option><option>الثلاثاء</option><option>الأربعاء</option><option>الخميس</option><option>الجمعة</option></select>
<input id="g-time" type="time" class="h-11 bg-black border border-zinc-800 rounded-xl px-3 text-sm outline-none">
<select id="g-hall" class="col-span-2 h-11 bg-black border border-zinc-800 rounded-xl px-3 text-sm outline-none"></select>
<input id="g-price" type="number" placeholder="سعر الحصة" class="col-span-2 h-11 bg-black border border-zinc-800 rounded-xl px-3 text-sm outline-none">
</div>
<div class="flex gap-2 mt-4"><button onclick="saveGroup()" class="flex-1 h-12 bg-amber-500 text-black rounded-xl font-black">حفظ</button><button onclick="closeM()" class="flex-1 h-12 bg-zinc-800 rounded-xl">إلغاء</button></div>
</div></div>

<div id="m-hall" class="fixed inset-0 z-[100] hidden bg-black/80 flex items-center justify-center p-3"><div class="bg-zinc-900 border border-zinc-800 rounded-[24px] w-full max-w-sm p-5">
<h2 class="font-bold mb-4">إضافة قاعة</h2><input id="h-name" placeholder="اسم القاعة" class="w-full h-11 bg-black border border-zinc-800 rounded-xl px-3 text-sm mb-2"><input id="h-cap" type="number" placeholder="السعة" class="w-full h-11 bg-black border border-zinc-800 rounded-xl px-3 text-sm mb-4"><div class="flex gap-2"><button onclick="saveHall()" class="flex-1 h-11 bg-amber-500 text-black rounded-xl font-bold">حفظ</button><button onclick="closeM()" class="flex-1 h-11 bg-zinc-800 rounded-xl">إلغاء</button></div>
</div></div>

<div id="m-settings" class="fixed inset-0 z-[100] hidden bg-black/80 flex items-center justify-center p-3"><div class="bg-zinc-900 border border-zinc-800 rounded-[24px] w-full max-w-md p-5">
<h2 class="font-black text-lg mb-4">⚙️ إعدادات سنتر الإيمان</h2>
<div class="space-y-2">
<label class="text-[11px] text-zinc-400">اسم السنتر</label><input id="set-center" class="w-full h-11 bg-black border border-zinc-800 rounded-xl px-3 text-sm">
<label class="text-[11px] text-zinc-400">سعر الحصة الافتراضي</label><input id="set-price" type="number" class="w-full h-11 bg-black border border-zinc-800 rounded-xl px-3 text-sm">
<label class="text-[11px] text-zinc-400">نسبة السنتر %</label><input id="set-percent" type="number" class="w-full h-11 bg-black border border-amber-500/40 rounded-xl px-3 text-sm">
<label class="text-[11px] text-zinc-400">سعة القاعة الافتراضية</label><input id="set-cap" type="number" class="w-full h-11 bg-black border border-zinc-800 rounded-xl px-3 text-sm">
<label class="text-[11px] text-zinc-400">رسالة واتساب الغياب {name} {group}</label><textarea id="set-msg" class="w-full h-20 bg-black border border-zinc-800 rounded-xl p-3 text-xs"></textarea>
</div>
<div class="flex gap-2 mt-4"><button onclick="saveSet()" class="flex-1 h-12 bg-amber-500 text-black rounded-xl font-black">حفظ</button><button onclick="closeM()" class="flex-1 h-12 bg-zinc-800 rounded-xl">إغلاق</button></div>
</div></div>

<script>
let DB = JSON.parse(localStorage.getItem('mando_center_os_v1')||'{"students":[],"groups":[],"halls":[{"id":"h1","name":"قاعة 1","cap":60},{"id":"h2","name":"قاعة 2","cap":50}],"attendance":[],"payments":[],"settings":{"centerName":"سنتر الإيمان","price":50,"percent":30,"cap":60,"msg":"السلام عليكم، الطالب {name} غاب اليوم عن حصة {group} في سنتر الإيمان. برجاء المتابعة."}}');
const save=()=>{localStorage.setItem('mando_center_os_v1',JSON.stringify(DB)); renderAll();};
const genId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const genCode=()=>{let n=(DB.students.length+1).toString().padStart(4,'0'); return `MC-2026-${n}`;};
document.getElementById('todayDate').textContent=new Date().toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'});
function openModal(t){if(t==='student'){let s=document.getElementById('st-group'); s.innerHTML='<option value="">بدون مجموعة</option>'+DB.groups.map(g=>`<option value="${g.id}">${g.subject} - ${g.teacher} - ${g.day} ${g.time}</option>`).join('');} if(t==='group'){let h=document.getElementById('g-hall'); h.innerHTML=DB.halls.map(x=>`<option value="${x.id}">${x.name} - سعة ${x.cap}</option>`).join('');} document.getElementById('m-'+t).classList.remove('hidden');}
function openSet(){document.getElementById('set-center').value=DB.settings.centerName; document.getElementById('set-price').value=DB.settings.price; document.getElementById('set-percent').value=DB.settings.percent; document.getElementById('set-cap').value=DB.settings.cap; document.getElementById('set-msg').value=DB.settings.msg; document.getElementById('m-settings').classList.remove('hidden');}
function closeM(){document.querySelectorAll('[id^=m-]').forEach(e=>e.classList.add('hidden'));}
function saveSet(){DB.settings.centerName=document.getElementById('set-center').value||'سنتر الإيمان'; DB.settings.price=parseFloat(document.getElementById('set-price').value)||50; DB.settings.percent=parseFloat(document.getElementById('set-percent').value)||30; DB.settings.cap=parseInt(document.getElementById('set-cap').value)||60; DB.settings.msg=document.getElementById('set-msg').value; document.getElementById('centerNameLabel').textContent=DB.settings.centerName+' - Premium'; save(); closeM();}
function saveHall(){let name=document.getElementById('h-name').value.trim(); let cap=parseInt(document.getElementById('h-cap').value)||60; if(!name) return alert('اسم القاعة'); DB.halls.push({id:genId(),name,cap}); save(); closeM();}
function saveStudent(){let name=document.getElementById('st-name').value.trim(); let phone=document.getElementById('st-phone').value.trim(); let parent=document.getElementById('st-parent').value.trim(); let school=document.getElementById('st-school').value.trim(); let grade=document.getElementById('st-grade').value.trim(); let area=document.getElementById('st-area').value.trim(); let groupId=document.getElementById('st-group').value; let status=document.getElementById('st-status').value; let customCode=document.getElementById('st-code').value.trim(); let note=document.getElementById('st-note').value.trim(); if(!name||!parent) return alert('الاسم ورقم ولي الأمر مطلوبين'); let code=customCode||genCode(); DB.students.push({id:genId(),code,name,phone,parent,school,grade,area,groupId,status,note,created:new Date().toISOString()}); save(); closeM(); ['st-name','st-phone','st-parent','st-school','st-grade','st-area','st-code','st-note'].forEach(i=>document.getElementById(i).value='');}
function saveGroup(){let subject=document.getElementById('g-subject').value.trim(); let teacher=document.getElementById('g-teacher').value.trim(); let day=document.getElementById('g-day').value; let time=document.getElementById('g-time').value; let hallId=document.getElementById('g-hall').value; let price=parseFloat(document.getElementById('g-price').value)||DB.settings.price; if(!teacher||!subject) return alert('المادة والمدرس مطلوبين'); DB.groups.push({id:genId(),subject,teacher,day,time,hallId,price}); save(); closeM();}
function delStudent(id){if(!confirm('حذف الطالب؟'))return; DB.students=DB.students.filter(s=>s.id!==id); save();}
function delGroup(id){if(!confirm('حذف المجموعة؟'))return; DB.groups=DB.groups.filter(g=>g.id!==id); DB.students.forEach(s=>{if(s.groupId===id) s.groupId='';}); save();}
function markAttend(studentCode, groupId, isPaid=true){let s=DB.students.find(x=>x.code===studentCode||x.id===studentCode); if(!s) return; if(s.status==='blocked') return alert('🚫 محظور'); let g=DB.groups.find(x=>x.id===groupId); if(!g) g=DB.groups.find(x=>x.id===s.groupId); if(!g) return; let today=new Date().toISOString().slice(0,10); if(DB.attendance.find(a=>a.date===today && a.studentId===s.id && a.groupId===g.id)) return alert('حضر اليوم بالفعل'); DB.attendance.push({id:genId(),date:today,studentId:s.id,groupId:g.id,time:new Date().toLocaleTimeString('ar-EG')}); let total=g.price||DB.settings.price; let centerTake=Math.round(total*DB.settings.percent/100); let teacherTake=total-centerTake; DB.payments.push({id:genId(),date:today,studentId:s.id,groupId:g.id,teacher:g.teacher,subject:g.subject,total,centerTake,teacherTake,paid:isPaid}); save();}
function togglePaid(id){let p=DB.payments.find(x=>x.id===id); if(p){p.paid=!p.paid; save();}}
function sendWhatsApp(studentId, type='absent'){let s=DB.students.find(x=>x.id===studentId); if(!s) return; let g=DB.groups.find(x=>x.id===s.groupId); let msg=DB.settings.msg.replace('{name}',s.name).replace('{group}',g?g.subject+' مع '+g.teacher:''); if(type==='debt') msg=`تنبيه: الطالب ${s.name} عليه مديونية في سنتر الإيمان. برجاء السداد.`; let phone=s.parent.replace(/^0/,''); if(phone.length<=11) phone='2'+phone; window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`,'_blank');}
function handleGroupScanner(code, groupId){code=String(code).trim(); if(!code) return; let s=DB.students.find(x=>x.code===code); if(!s){alert('❌ غير موجود: '+code); return;} s.groupId=groupId; save(); markAttend(s.code, groupId, true);}
function doGlobalScan(){let code=document.getElementById('globalScan').value.trim(); if(!code) return; handleGlobal(code);}
function handleGlobal(code){let s=DB.students.find(x=>x.code===code); if(!s) return alert('غير موجود'); if(!s.groupId) return alert('بدون مجموعة'); markAttend(s.code, s.groupId, true); document.getElementById('globalScan').value='';}
document.getElementById('globalScan').addEventListener('keydown',e=>{if(e.key==='Enter') handleGlobal(e.target.value)});
function switchView(v){document.querySelectorAll('[id^=view-]').forEach(el=>el.classList.add('hidden')); document.getElementById('view-'+v).classList.remove('hidden'); document.querySelectorAll('.vbtn').forEach(b=>{b.className='vbtn h-10 px-5 bg-zinc-900 border border-zinc-800 rounded-xl font-bold text-xs'}); document.querySelector(`[data-v=${v}]`).className='vbtn h-10 px-5 bg-amber-500 text-black rounded-xl font-bold text-xs'; if(v==='roster') renderRoster(); if(v==='students') renderStudents(); if(v==='kashkool') renderKashkool(); if(v==='debts') renderDebts();}
function renderRoster(){let html=''; DB.groups.forEach(g=>{let hall=DB.halls.find(h=>h.id===g.hallId); let students=DB.students.filter(s=>s.groupId===g.id); let cap=hall?hall.cap:DB.settings.cap; let today=new Date().toISOString().slice(0,10); let present=DB.attendance.filter(a=>a.date===today && a.groupId===g.id).length; html+=`<div class="bg-zinc-900 border border-zinc-800 rounded-[20px] p-4 mb-3"><div class="flex flex-wrap justify-between gap-2 mb-3"><div><div class="flex gap-2 items-center"><span class="bg-amber-500 text-black text-[10px] font-black px-2 py-1 rounded-lg">${g.subject}</span><h3 class="font-extrabold">${g.teacher}</h3></div><div class="text-[11px] text-zinc-400 mt-1">📅 ${g.day} - ⏰ ${g.time||'--:--'} - 🏫 ${hall?hall.name:''} - 💰 ${g.price}ج - 👥 ${students.length}/${cap} - ✅ ${present}</div></div><button onclick="delGroup('${g.id}')" class="h-8 px-3 bg-red-950/40 text-red-400 border border-red-900/30 rounded-xl text-[11px]">حذف</button></div><div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-2">${students.map(s=>{let todayAtt=DB.attendance.find(a=>a.date===today && a.studentId===s.id && a.groupId===g.id); return `<div class="bg-black border ${todayAtt?'border-emerald-500/50':'border-zinc-800'} rounded-xl p-2.5"><div class="text-[11px] font-bold truncate">${s.name}</div><div class="mono text-[10px] text-zinc-500">${s.code}</div><div class="flex gap-1 mt-2"><button onclick="markAttend('${s.code}','${g.id}',true)" class="flex-1 h-7 ${todayAtt?'bg-emerald-500 text-black':'bg-amber-500/20 text-amber-400'} rounded-lg text-[10px] font-bold">${todayAtt?'✅ حضر':'حضور + دفع'}</button><button onclick="sendWhatsApp('${s.id}')" class="h-7 w-7 bg-zinc-800 rounded-lg text-[10px]">💬</button></div></div>`}).join('')||'<div class="col-span-full text-center text-xs text-zinc-600 py-6">لا طلاب - استخدم السكانر</div>'}</div><div class="mt-3 flex gap-2"><input onkeydown="if(event.key==='Enter'){handleGroupScanner(this.value,'${g.id}'); this.value='';}" placeholder="📷 سكان لإضافة طالب لحجز ${g.teacher}" class="flex-1 h-11 bg-black border border-amber-400/40 rounded-xl px-3 text-xs mono text-amber-400 outline-none"><button onclick="DB.students.filter(s=>s.groupId==='${g.id}').forEach(s=>{let today=new Date().toISOString().slice(0,10); if(!DB.attendance.find(a=>a.date===today && a.studentId===s.id)){sendWhatsApp(s.id)}})" class="h-11 px-4 bg-zinc-800 border border-zinc-700 rounded-xl text-xs">📤 غياب واتساب</button></div></div>`;}); document.getElementById('view-roster').innerHTML=html||'<div class="text-center text-zinc-500 py-20">لا مجموعات</div>';}
function renderStudents(){let q=(document.getElementById('stuSearch')?.value||'').toLowerCase(); let f=document.getElementById('stuFilter')?.value||''; let html=`<div class="bg-zinc-900 border border-zinc-800 rounded-[20px] p-3 mb-3 flex gap-2"><input id="stuSearch" oninput="renderStudents()" placeholder="بحث اسم/كود/ولي أمر" class="flex-1 h-11 bg-black border border-zinc-800 rounded-xl px-3 text-sm"><select id="stuFilter" onchange="renderStudents()" class="h-11 bg-black border border-zinc-800 rounded-xl px-3 text-sm"><option value="">كل الحالات</option><option value="active">نشط</option><option value="blocked">محظور</option><option value="debtor">مديون</option></select></div><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-2">`; DB.students.filter(s=>{let m=!q||s.name.toLowerCase().includes(q)||s.code.toLowerCase().includes(q)||s.parent.includes(q); let mf=!f||s.status===f; return m&&mf;}).forEach(s=>{let g=DB.groups.find(x=>x.id===s.groupId); html+=`<div class="bg-zinc-900 border border-zinc-800 rounded-[20px] p-3"><div class="flex justify-between"><div><div class="font-bold text-sm">${s.name}</div><div class="mono text-[11px] text-amber-400">${s.code}</div><div class="text-[11px] text-zinc-400 mt-1">📱 ${s.phone||'--'} | 👪 ${s.parent}</div><div class="text-[11px] text-zinc-500">${g?g.subject+' - '+g.teacher:'بدون'} - ${s.area||''}</div></div><div class="text-[10px] px-2 py-1 rounded-lg h-fit ${s.status==='active'?'bg-emerald-950 text-emerald-400':'bg-red-950 text-red-400'}">${s.status}</div></div><div class="flex gap-1.5 mt-3"><button onclick="sendWhatsApp('${s.id}')" class="flex-1 h-8 bg-zinc-800 rounded-xl text-[11px]">💬 واتساب</button><button onclick="delStudent('${s.id}')" class="h-8 px-3 bg-red-950/30 text-red-400 rounded-xl text-[11px]">حذف</button></div></div>`;}); html+='</div>'; document.getElementById('view-students').innerHTML=html;}
function renderKashkool(){let today=new Date().toISOString().slice(0,10); let payments=DB.payments.filter(p=>p.date===today); let byTeacher={}; payments.forEach(p=>{if(!byTeacher[p.teacher]) byTeacher[p.teacher]={subject:p.subject,total:0,center:0,teacherTake:0,count:0,students:[]}; byTeacher[p.teacher].total+=p.total; byTeacher[p.teacher].center+=p.centerTake; byTeacher[p.teacher].teacherTake+=p.teacherTake; byTeacher[p.teacher].count++; byTeacher[p.teacher].students.push(DB.students.find(s=>s.id===p.studentId)?.name||'');}); let html=`<div class="bg-zinc-900 border border-emerald-500/20 rounded-[24px] p-4 mb-3"><h2 class="font-black text-lg">📒 الكشكول الكبير - ${today}</h2><p class="text-[11px] text-zinc-500">فلوس السنتر ${DB.settings.percent}%</p></div><div class="bg-black border border-zinc-800 rounded-[20px] overflow-hidden"><div class="overflow-x-auto"><table class="w-full text-xs"><thead class="bg-zinc-900 text-zinc-400"><tr><th class="p-3 text-right">المدرس</th><th class="p-3">حضور</th><th class="p-3">إجمالي</th><th class="p-3 text-emerald-400">السنتر</th><th class="p-3">المدرس</th><th class="p-3">الطلاب</th></tr></thead><tbody>`; Object.entries(byTeacher).forEach(([t,d])=>{html+=`<tr class="border-t border-zinc-800"><td class="p-3 font-bold">${t}<div class="text-[10px] text-zinc-500">${d.subject}</div></td><td class="p-3 text-center">${d.count}</td><td class="p-3 text-center font-bold">${d.total}ج</td><td class="p-3 text-center text-emerald-400 font-bold">${d.center}ج</td><td class="p-3 text-center">${d.teacherTake}ج</td><td class="p-3 text-[11px] text-zinc-400">${d.students.join('، ')}</td></tr>`;}); if(Object.keys(byTeacher).length===0) html+=`<tr><td colspan="6" class="p-10 text-center text-zinc-600">لا حضور اليوم</td></tr>`; html+=`</tbody></table></div></div>`; document.getElementById('view-kashkool').innerHTML=html; updateStats();}
function renderDebts(){let debts=DB.payments.filter(p=>!p.paid); let html=`<div class="bg-zinc-900 border border-red-500/20 rounded-[20px] p-4 mb-3"><h2 class="font-bold">💳 مديونيات - ${debts.length}</h2></div><div class="grid gap-2">`+debts.map(p=>{let s=DB.students.find(x=>x.id===p.studentId); return `<div class="bg-zinc-900 border border-zinc-800 rounded-xl p-3 flex justify-between"><div><div class="font-bold text-sm">${s?.name||''} - ${s?.code||''}</div><div class="text-[11px] text-zinc-400">${p.subject} ${p.teacher} - ${p.total}ج</div></div><div class="flex gap-1.5"><button onclick="sendWhatsApp('${s?.id}','debt')" class="h-8 px-3 bg-green-600 text-white rounded-xl text-xs">💬</button><button onclick="togglePaid('${p.id}')" class="h-8 px-3 bg-amber-500 text-black rounded-xl text-xs font-bold">سدد</button></div></div>`}).join('')+`</div>`; document.getElementById('view-debts').innerHTML=html;}
function renderHalls(){document.getElementById('hallsList').innerHTML=DB.halls.map(h=>{let used=DB.groups.filter(g=>g.hallId===h.id).length; return `<div class="flex justify-between bg-zinc-900 border border-zinc-800 rounded-xl p-2.5 text-xs"><div><div class="font-bold">${h.name}</div><div class="text-[10px] text-zinc-500">سعة ${h.cap} - ${used} مجموعات</div></div><button onclick="DB.halls=DB.halls.filter(x=>x.id!=='${h.id}'); save();" class="text-red-400">✕</button></div>`}).join('');}
function updateStats(){let today=new Date().toISOString().slice(0,10); let todays=DB.payments.filter(p=>p.date===today); let income=todays.reduce((a,b)=>a+b.total,0); let center=todays.reduce((a,b)=>a+b.centerTake,0); let teacher=todays.reduce((a,b)=>a+b.teacherTake,0); let attend=DB.attendance.filter(a=>a.date===today).length; document.getElementById('statIncome').textContent=income+' جنيه'; document.getElementById('statCenter').textContent=center+' جنيه'; document.getElementById('statTeacher').textContent=teacher+' جنيه'; document.getElementById('statAttend').textContent=attend;}
function renderAll(){renderHalls(); renderRoster(); renderStudents(); renderKashkool(); renderDebts(); updateStats(); document.getElementById('centerNameLabel').textContent=DB.settings.centerName+' - Premium';}
function exportDB(){let b=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'}); let a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=`backup_${new Date().toISOString().slice(0,10)}.json`; a.click();}
renderAll(); switchView('roster');
</script>
</body>
