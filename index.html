<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mando Center</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-[#0f172a] text-white min-h-screen"><div id="login" class="flex items-center justify-center min-h-screen p-4"><div class="bg-slate-800 p-8 rounded-2xl w-full max-w-sm"><h1 class="text-2xl font-bold text-center mb-6">Mando Center</h1><input id="u" value="admin" class="w-full p-3 rounded-lg bg-slate-900 border border-slate-700 mb-3" placeholder="user"><input id="p" type="password" class="w-full p-3 rounded-lg bg-slate-900 border border-slate-700 mb-4" placeholder="pass"><button onclick="login()" class="w-full bg-indigo-600 p-3 rounded-lg font-bold">دخول</button><p class="text-xs text-center text-slate-500 mt-3">admin / ChangeMe123!</p></div></div><div id="app" class="hidden max-w-6xl mx-auto p-3"><div class="flex justify-between items-center bg-slate-800 p-4 rounded-xl mb-3"><h1 class="font-bold">Mando Center Web</h1><button onclick="localStorage.removeItem('mando_user');location.reload()" class="text-xs bg-slate-700 px-3 py-1 rounded">خروج</button></div><div class="flex gap-2 mb-3 flex-wrap" id="tabs"></div><div class="bg-slate-800 rounded-xl p-4" id="content"></div></div><script>
const LS=k=>JSON.parse(localStorage.getItem(k)||"[]");const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const init=()=>{["mando_students","mando_groups","mando_enrollments","mando_sessions","mando_attendance","mando_transactions","mando_audit"].forEach(k=>{if(!localStorage.getItem(k))SV(k,[])})};
const audit=(a,e,id,d)=>{let x=LS("mando_audit");x.push({id:Date.now(),at:new Date().toLocaleString('ar-EG'),username:localStorage.getItem("mando_user"),action:a,entity:e,entity_id:String(id),details:d});SV("mando_audit",x)};
let curTab="students";let curSess=null;
function login(){let u=document.getElementById('u').value,p=document.getElementById('p').value;if(u==="admin"&&(p==="ChangeMe123!"||p==="")){localStorage.setItem("mando_user","admin");document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');init();renderTabs();render();}else alert("admin / ChangeMe123!")}
function renderTabs(){let t=[{id:"students",l:"الطلاب"},{id:"groups",l:"المجموعات"},{id:"attendance",l:"الحضور"},{id:"payments",l:"المدفوعات"},{id:"tools",l:"التصدير"}];document.getElementById('tabs').innerHTML=t.map(x=>`<button onclick="curTab='${x.id}';render()" class="px-4 py-2 rounded-full text-sm ${curTab===x.id?'bg-indigo-600':'bg-slate-700'}">${x.l}</button>`).join('')}
function render(){renderTabs();if(curTab==="students")rStudents();if(curTab==="groups")rGroups();if(curTab==="attendance")rAtt();if(curTab==="payments")rPay();if(curTab==="tools")rTools();}
function rStudents(){let s=LS("mando_students").reverse();document.getElementById('content').innerHTML=`<div class="grid grid-cols-2 gap-2 bg-slate-900 p-3 rounded mb-3"><input id="sn" placeholder="الاسم *" class="p-2 rounded bg-slate-700"><input id="sb" placeholder="Barcode *" class="p-2 rounded bg-slate-700"><input id="sp" placeholder="الهاتف" class="p-2 rounded bg-slate-700"><input id="sf" type="number" placeholder="سعر الحصة" class="p-2 rounded bg-slate-700"><button onclick="addS()" class="col-span-2 bg-indigo-600 p-2 rounded font-bold">+ إضافة طالب</button></div><table class="w-full text-sm"><tr class="text-slate-400"><th>Barcode</th><th>الاسم</th><th>الرسوم</th></tr>${s.map(x=>`<tr class="border-t border-slate-700"><td class="p-2 font-mono">${x.barcode}</td><td>${x.name}</td><td>${x.lesson_fee}</td></tr>`).join('')}</table>`}
function addS(){let n=document.getElementById('sn').value.trim(),b=document.getElementById('sb').value.trim();if(!n||!b)return alert("الاسم والباركود");let a=LS("mando_students");if(a.find(x=>x.barcode===b))return alert("موجود");a.push({id:Date.now(),barcode:b,name:n,phone:document.getElementById('sp').value,plan:"per_lesson",lesson_fee:parseFloat(document.getElementById('sf').value)||0,active:1});SV("mando_students",a);audit("CREATE","student",Date.now(),b);render();}
function rGroups(){let g=LS("mando_groups");document.getElementById('content').innerHTML=`<div class="flex gap-2 bg-slate-900 p-3 rounded mb-3"><input id="gn" placeholder="اسم المجموعة" class="flex-1 p-2 rounded bg-slate-700"><input id="gs" placeholder="المادة" class="flex-1 p-2 rounded bg-slate-700"><button onclick="addG()" class="bg-indigo-600 px-4 rounded">إضافة</button></div><div class="bg-slate-900 p-3 rounded mb-3 flex gap-2"><input id="eb" placeholder="Barcode الطالب" class="flex-1 p-2 rounded bg-slate-800"><select id="eg" class="flex-1 p-2 rounded bg-slate-800">${g.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}</select><button onclick="enroll()" class="bg-emerald-600 px-4 rounded">تسجيل</button></div><table class="w-full text-sm">${g.map(x=>`<tr class="border-t border-slate-700"><td class="p-2">${x.name}</td><td>${x.subject}</td></tr>`).join('')}</table>`}
function addG(){let n=document.getElementById('gn').value;if(!n)return alert("الاسم");let a=LS("mando_groups");a.push({id:Date.now(),name:n,subject:document.getElementById('gs').value});SV("mando_groups",a);render();}
function enroll(){let b=document.getElementById('eb').value.trim(),gid=parseInt(document.getElementById('eg').value),st=LS("mando_students").find(s=>s.barcode===b);if(!st)return alert("الطالب مش موجود");let e=LS("mando_enrollments");e.push({student_id:st.id,group_id:gid});SV("mando_enrollments",e);alert("تم تسجيل "+st.name);}
function rAtt(){let g=LS("mando_groups"),sess=LS("mando_sessions");if(sess.length)curSess=sess[sess.length-1];let att=LS("mando_attendance").slice(-50).reverse(),studs=LS("mando_students");document.getElementById('content').innerHTML=`<div class="bg-slate-900 p-3 rounded mb-3"><select id="selG" class="w-full p-3 rounded bg-slate-800 mb-2"><option value="">اختر المجموعة</option>${g.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}</select><button onclick="createS()" class="w-full bg-emerald-600 p-2 rounded mb-2">إنشاء حصة اليوم</button><div class="flex gap-2"><input id="scan" placeholder="امسح الباركود" class="flex-1 p-4 text-xl rounded bg-black border-2 border-indigo-500 text-center" onkeydown="if(event.key==='Enter')doScan()"><button onclick="doScan()" class="bg-indigo-600 px-6 rounded">حضور</button></div></div><table class="w-full text-sm">${att.map(a=>{let s=studs.find(x=>x.id===a.student_id);return `<tr class="border-t border-slate-700"><td class="p-2 text-xs">${a.scanned_at}</td><td>${s?.name||"?"}</td><td class="font-mono">${s?.barcode||""}</td></tr>`}).join('')}</table>`}
function createS(){let gid=parseInt(document.getElementById('selG').value);if(!gid)return alert("اختر مجموعة");let r={id:Date.now(),group_id:gid};let a=LS("mando_sessions");a.push(r);SV("mando_sessions",a);curSess=r;render();}
function doScan(){let code=document.getElementById('scan').value.trim();if(!code||!curSess)return alert("أنشئ حصة");let studs=LS("mando_students"),s=studs.find(x=>x.barcode===code);if(!s)return alert("غير مسجل");let att=LS("mando_attendance");if(att.find(a=>a.student_id===s.id&&a.session_id===curSess.id))return alert("مسجل بالفعل");att.push({id:Date.now(),student_id:s.id,session_id:curSess.id,scanned_at:new Date().toLocaleString('ar-EG')});SV("mando_attendance",att);if(s.lesson_fee){let tr=LS("mando_transactions");tr.push({id:Date.now(),student_id:s.id,amount:-Math.abs(s.lesson_fee),kind:"lesson_charge",created_at:new Date().toISOString()});SV("mando_transactions",tr);}document.getElementById('scan').value="";render();alert("✅ "+s.name);}
function rPay(){let tr=LS("mando_transactions").reverse().slice(0,100),studs=LS("mando_students");document.getElementById('content').innerHTML=`<div class="flex gap-2 bg-slate-900 p-3 rounded mb-3"><input id="pb" placeholder="Barcode" class="flex-1 p-2 rounded bg-slate-700"><input id="pa" type="number" placeholder="المبلغ" class="flex-1 p-2 rounded bg-slate-700"><button onclick="addP()" class="bg-indigo-600 px-4 rounded">دفع</button></div><table class="w-full text-xs">${tr.map(t=>{let s=studs.find(x=>x.id===t.student_id);return `<tr class="border-t border-slate-700"><td class="p-2">${s?.name||t.student_id}</td><td class="${t.amount<0?'text-red-400':'text-green-400'}">${t.amount}</td><td>${t.kind}</td></tr>`}).join('')}</table>`}
function addP(){let b=document.getElementById('pb').value.trim(),a=parseFloat(document.getElementById('pa').value),s=LS("mando_students").find(x=>x.barcode===b);if(!s||!a)return alert("بيانات ناقصة");let tr=LS("mando_transactions");tr.push({id:Date.now(),student_id:s.id,amount:a,kind:"payment",created_at:new Date().toISOString()});SV("mando_transactions",tr);render();}
function rTools(){document.getElementById('content').innerHTML=`<button onclick="let all={};for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);if(k.startsWith('mando_'))all[k]=localStorage.getItem(k);}let b=new Blob([JSON.stringify(all)],{type:'application/json'});let u=URL.createObjectURL(b);let a=document.createElement('a');a.href=u;a.download='backup.json';a.click();" class="w-full bg-slate-900 p-4 rounded-lg mb-2">📦 تحميل نسخة احتياطية</button><button onclick="if(confirm('مسح الكل؟')){Object.keys(localStorage).forEach(k=>{if(k.startsWith('mando_'))localStorage.removeItem(k)});location.reload()}" class="w-full bg-red-900 p-4 rounded-lg">🗑️ مسح البيانات</button>`}
init();if(localStorage.getItem("mando_user")){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');renderTabs();render();}
</script></body></html>
